<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console ownership verification -->
    <meta name="google-site-verification" content="YzDkhTkRgboS7qGzVpaMq6ft7lxDWGqyvOzNzucqbmA" />

    <!-- Title, description, canonical, OG/Twitter: keep in sync with src/seo/site.ts
         (src/seo/seo.test.ts fails when they drift). The JSON-LD graph is generated from
         src/data at build time and injected by scripts/seo/prerender.mjs. -->
    <title>Roy Carmelli (רועי כרמלי) - Full-Stack &amp; AI Developer</title>
    <meta name="description" content="Third-year Computer Science &amp; Neuroscience student at Bar-Ilan University. I build web apps, Chrome extensions and AI tools. Open to student and intern roles in Israel." />
    <link rel="canonical" href="https://roy-carmelli-portfolio.vercel.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Roy Carmelli" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Roy Carmelli" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://roy-carmelli-portfolio.vercel.app/" />
    <meta property="og:title" content="Roy Carmelli (רועי כרמלי) - Full-Stack &amp; AI Developer" />
    <meta property="og:description" content="Third-year Computer Science &amp; Neuroscience student at Bar-Ilan University. I build web apps, Chrome extensions and AI tools. Open to student and intern roles in Israel." />
    <meta property="og:image" content="https://roy-carmelli-portfolio.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Roy Carmelli&#39;s pixel-art portfolio title screen: Full-Stack &amp; AI Developer, standing in a forest" />
    <meta property="profile:first_name" content="Roy" />
    <meta property="profile:last_name" content="Carmelli" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roy Carmelli (רועי כרמלי) - Full-Stack &amp; AI Developer" />
    <meta name="twitter:description" content="Third-year Computer Science &amp; Neuroscience student at Bar-Ilan University. I build web apps, Chrome extensions and AI tools. Open to student and intern roles in Israel." />
    <meta name="twitter:image" content="https://roy-carmelli-portfolio.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Roy Carmelli&#39;s pixel-art portfolio title screen: Full-Stack &amp; AI Developer, standing in a forest" />

    <!-- The same person elsewhere (also the Person's sameAs in the JSON-LD) -->
    <link rel="me" href="https://github.com/Royc4515" />
    <link rel="me" href="https://linkedin.com/in/roy-carmelli" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme before first paint (stored choice, else the OS preference). It runs before the
         stylesheet, so the first frame already has the right ground; useTheme reads the attribute. -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('roy-portfolio-theme'); } catch (e) {}
        if (t !== 'day' && t !== 'night') {
          try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'; } catch (e) { t = 'day'; }
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <!-- Preload the three critical font files (same URLs as the @font-face rules in src/index.css) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/press-start-2p-latin-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-sans-latin-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-mono-latin-500.woff2" crossorigin />

    <style>
      /* --color-bg of the active theme until the stylesheet loads; follows the token after that */
      body { background-color: var(--color-bg, #1a2e10); }
      :root[data-theme="night"] body { background-color: var(--color-bg, #0a0f1e); }

      /* Boot card: who this is and the CV, shown when the JavaScript is slow to arrive. The
         prerendered page in #root stays invisible until the app replaces it (its layout is
         computed for one desktop window), so a slow connection used to show a blank screen
         for seconds. main.tsx removes the card in the same frame the app renders.
         don't touch / the 0.4s delay keeps the card from flashing on a normal load: it only
         becomes visible if the app has not rendered by then. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        font: 400 16px/1.5 "IBM Plex Sans", system-ui, sans-serif;
        color: var(--color-fg, #ede0b8);
        visibility: hidden;
        animation: boot-show 1ms linear 0.4s forwards;
      }
      #boot p { margin: 0; }
      #boot .boot-name { font: 400 24px/1.4 "Press Start 2P", ui-monospace, monospace; }
      #boot .boot-role { font-weight: 600; color: var(--color-accent-fg, #dcb65c); }
      #boot .boot-note { color: var(--color-fg-muted, #c9b87a); }
      #boot a {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 20px;
        font-weight: 600;
        text-decoration: none;
        background-color: var(--color-accent, #c9a24a);
        color: var(--color-on-accent, #1a2e10);
      }
      #boot a:focus-visible { outline: 2px solid var(--color-fg, #ede0b8); outline-offset: 4px; }
      @keyframes boot-show { to { visibility: visible; } }
    </style>
    <!-- Without JavaScript the prerendered page itself is shown, so the boot card steps aside. -->
    <noscript><style>#boot { display: none; }</style></noscript>
  </head>
  <body>
    <!-- Keep in sync with src/data/bio.ts (name, role, availability, resume): src/seo/seo.test.ts
         fails when they drift. data-nosnippet: search results quote the real page, not this card. -->
    <div id="boot" data-nosnippet>
      <p class="boot-name">Roy Carmelli</p>
      <p class="boot-role">Full-Stack &amp; AI Developer</p>
      <p>Student &amp; intern roles · Israel</p>
      <a href="/Roy_Carmelli_CV.pdf" download="Roy_Carmelli_CV.pdf">Download resume (PDF)</a>
      <p class="boot-note">Loading the full site...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
